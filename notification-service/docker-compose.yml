services:
  notification-service:
    build:
      context: .
      target: runner
    image: notification-service:latest
    container_name: notification-service
    env_file:
      - .env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:19092
      - SERVER_PORT=4008
      - MAILTRAP_KEY=${MAILTRAP_KEY}
    ports:
      - "4008:4008"
    networks:
      - internal

networks:
  internal:
    external: true


