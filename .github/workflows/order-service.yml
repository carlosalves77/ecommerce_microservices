name: CI/CD Homelab - Order Service
on:
  push:
    branches: [ "master" ]
    paths:
      - 'order-service/**'  
jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Ler versão do pom.xml
        id: get_version
        run: |
          cd order-service
          
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          
          echo "Versão detectada no POM: $VERSION"
          
          echo "PROJECT_VERSION=$VERSION" >> $GITHUB_ENV
      - name: Build com Maven
        run: mvn clean package -DskipTests
        working-directory: ./order-service

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build e Push da Imagem
        run: |
          cd order-service
          
          echo "Buildando imagem versão: $PROJECT_VERSION"
          
          docker build -t ${{ secrets.DOCKER_USERNAME }}/orders-service:$PROJECT_VERSION .
          docker push ${{ secrets.DOCKER_USERNAME }}/orders-service:$PROJECT_VERSION

      
      - name: Atualizar Repositório de CD (GitOps)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }} 
          USER_EMAIL: "ci-bot@outlook.com"
          USER_NAME: "CI Bot"
          CD_REPO: "carlosalves77/homelab-kubernetes" 
          FILE_PATH: "order-service-k8s/order-service-deploy.yaml"
        run: |
          echo "Clonando repositório de CD..."

          rm -rf cd-repo || true
          git config --global --unset credential.helper || true
          
          git clone https://${GH_TOKEN}@github.com/${CD_REPO}.git cd-repo
          
          cd cd-repo
          
          # Configurar Git
          git config user.name "$USER_NAME"
          git config user.email "$USER_EMAIL"

          echo "Tentando editar: $FILE_PATH"
          ls -la $FILE_PATH || echo "ERRO: Arquivo não encontrado!"

          sed -i "s|image: ${{ secrets.DOCKER_USERNAME }}/orders-service:.*|image: ${{ secrets.DOCKER_USERNAME }}/orders-service:$PROJECT_VERSION|" $FILE_PATH

          if git diff --quiet; then
            echo "Nenhuma mudança detectada no manifesto Kubernetes. A versão já está atualizada?"
          else
            echo "Mudança detectada. Commitando..."
            git add $FILE_PATH
            git commit -m "Update api-gateway image to version $PROJECT_VERSION"
            git push origin main 
            echo "Repositório de CD atualizado com sucesso!"
          fi
