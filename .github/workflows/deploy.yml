name: CI/CD Homelab

on:
  push:
    branches: [ "master" ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build com Maven
      run: mvn clean package -DskipTests
      working-directory: ./auth-service

    - name: Login no Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build e Push da Imagem
      run: |
          # ${{ github.ref_name }} conterá "v1.0.5" automaticamente
          VERSION=${{ github.ref_name }}
          
          echo "Gerando versão: $VERSION"
          
          docker build -t ${{ secrets.DOCKER_USERNAME }}/auth-service:$VERSION .
          docker push ${{ secrets.DOCKER_USERNAME }}/auth-service:$VERSION

    - name: Deploy no Kubernetes Local
      run: |
        kubectl set image deployment/auth-service auth-service=${{ secrets.DOCKER_USERNAME }}/auth-service:${{ github.sha }} -n default
            

        
