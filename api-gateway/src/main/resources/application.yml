server:
  port: 4000

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-public-route
              uri: http://auth-service:4005
              predicates:
                - Path=/api/auth/login, /api/auth/register, /api/auth/verify-account, /api/auth/reset-password/**

            - id: auth-private-route
              uri: http://auth-service:4005
              predicates:
                 - Path=/api/auth/user/**, /api/auth/all, /api/auth/validate
              filters:
                - JwtValidation

            - id: auth-swagger-route
              uri: http://auth-service:4005
              predicates:
              - Path=/auth/v3/api-docs/**
              filters:
                - RewritePath=/auth/(?<segment>.*), /$\{segment}

            - id: product-route
              uri: http://product-catalog-service:4004
              predicates:
                - Path=/api/product/**
              filters:
                - JwtValidation

            - id: product-service-swagger-route
              uri: http://product-catalog-service:4004
              predicates:
              - Path=/product/v3/api-docs/**
              filters:
                - RewritePath=/product/(?<segment>.*), /$\{segment}

            - id: categories-route
              uri: http://product-catalog-service:4004
              predicates:
                - Path=/api/categories/**
              filters:
                - JwtValidation

            - id: shopping-cart-service-route
              uri: http://shopping-cart-service:4006
              predicates:
                - Path=/api/cart/**
              filters:
                - JwtValidation

            - id: shopping-cart-service-swagger-route
              uri: http://shopping-cart-service:4006
              predicates:
                - Path=/cart/v3/api-docs/**
              filters:
                - RewritePath=/cart/(?<segment>.*), /$\{segment}

            - id: payment-service-route
              uri: http://payment-service:4007
              predicates:
                - Path=/api/payment/**
              filters:
                - JwtValidation

            - id: payment-service-swagger-route
              uri: http://payment-service:4007
              predicates:
                - Path=/payment/v3/api-docs/**
              filters:
                - RewritePath=/payment/(?<segment>.*), /$\{segment}



springdoc:
  swagger-ui:
    path: /swagger
    use-root-path: true
    urls:
      - name: Auth Service
        url: /auth/v3/api-docs
      - name: Product Catalog Service
        url: /product/v3/api-docs
      - name: Cart Shopping Service
        url: /cart/v3/api-docs
      - name: Payment Service
        url: /payment/v3/api-docs
  api-docs:
    enabled: true